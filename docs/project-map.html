<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stationwagon Project Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* The final app, area by area: a summary band (every feature as one tick on a dial-like strip,
   and the road to v1.0), then one card per area listing what is still to build before what is
   built, beside a narrow column for the next step, the one decision and recent changes. */
:root{
  color-scheme: light;
  --ground:#f4f6f3; --panel:#ffffff; --line:#dbe2da; --tick:#c7d0c6;
  --ink:#14201a; --muted:#56635b; --faint:#88938b;
  --accent:#12844a; --accent-soft:#e1f2e7;
  --warn:#a86400; --warn-soft:#fff0d6;
  --onair:#c7303f; --onair-soft:#fbe7e9;
  --cue:#2b62c0; --cue-soft:#e5edfb;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font:15px/1.5 var(--f-ui);padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
a{color:var(--accent)}
code{font:500 13px var(--f-mono)}

/* masthead */
.mast{display:flex;align-items:baseline;gap:8px 18px;flex-wrap:wrap}
.brand{font:800 26px/1 var(--f-ui);letter-spacing:-.03em}
.mast .sub{color:var(--muted);font-weight:500}
.mast .meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.mast .meta b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.mast .waiting{color:var(--onair);font-weight:600}
.mast .waiting::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--onair);margin-right:6px;vertical-align:1px}

/* summary band */
.band{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:18px}
.total{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.total .big{font:800 40px/1 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.total .of{font:700 18px var(--f-ui);color:var(--muted)}
.total .lbl{color:var(--muted)}
.total .found{margin-left:auto;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.total .found::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* every feature is one tick, like a dial scale */
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;height:22px}
.scale i{border-radius:3px;background:var(--panel);border:1px dashed var(--tick)}
.scale i.done{background:var(--accent);border:0}
.scale i.progress{background:var(--warn);border:0}
.scale i.waiting{background:var(--onair);border:0}
.scale i.next{background:var(--panel);border:1.5px solid var(--faint)}
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stop{border-radius:14px;padding:12px 14px;background:var(--ground);display:grid;gap:4px;align-content:start;min-width:0}
.stop .ver{font:500 12px var(--f-mono);color:var(--faint)}
.stop .name{font:700 15px/1.25 var(--f-ui)}
.stop .when{font-size:13px;color:var(--muted)}
.stop .cnt{font:600 13px var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.stop .mini{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.stop .mini b{display:block;height:100%;background:var(--accent)}
.donestops{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.donestops .stop{flex:0 0 auto}
.stop.full{padding:8px 14px;gap:0;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:baseline;background:transparent;border:1px solid var(--line)}
.stop.full .name{font-size:14px;font-weight:600;color:var(--muted)}
.stop.full .name::after{content:" \2713";color:var(--accent);font-weight:700}
.stop.full .when,.stop.full .cnt,.stop.full .mini{display:none}
.stop .steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.stop .steps li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;align-items:start;font-size:13px;line-height:1.35;color:var(--ink)}
.stop .steps li i{width:8px;height:8px;border-radius:50%;margin-top:5px;border:1.5px solid var(--faint)}
.stop .steps li.done i{background:var(--accent);border-color:var(--accent)}
.stop .steps li.next i{border-color:var(--warn)}
.stop.now{background:var(--panel);border:2px solid var(--ink);box-shadow:0 0 0 4px var(--accent-soft)}
.stop.now .when{color:var(--ink);font-weight:600}
.stop.now .when::before{content:"Now · ";color:var(--onair);font-weight:700}
@media (max-width:760px){.road{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--panel);border:1px dashed var(--tick)}
.legend .done::before{background:var(--accent);border:0}
.legend .progress::before{background:var(--warn);border:0}
.legend .waiting::before{background:var(--onair);border:0}
.legend .next::before{border:1.5px solid var(--faint)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
@media (max-width:400px){.areas{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.area{display:grid;gap:10px;align-content:start}
.ahead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.ahead h2{margin:0;font:800 18px/1.2 var(--f-ui);text-wrap:balance}
.ahead .cnt{font:600 13px var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.ahead p{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.abar{display:flex;gap:2px;height:6px}
.abar i{flex:1;border-radius:2px;background:var(--line)}
.abar i.done{background:var(--accent)} .abar i.progress{background:var(--warn)} .abar i.waiting{background:var(--onair)}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.feats li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 6px;border-radius:8px;font-size:14px}
.feats li .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--faint);transform:translateY(1px)}
.feats li .tag{font:500 12px var(--f-mono);color:var(--faint);white-space:nowrap}
.feats li .what{min-width:0}
.feats li small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.feats li.progress{background:var(--warn-soft)}
.feats li.progress .dot{background:var(--warn);border-color:var(--warn)}
.feats li.progress .tag{color:var(--warn)}
.feats li.waiting{background:var(--onair-soft)}
.feats li.waiting .dot{background:var(--onair);border-color:var(--onair)}
.feats li.waiting .tag{color:var(--onair)}
.feats li.later .dot{border-style:dashed;border-color:var(--tick)}
.feats li.later .what{color:var(--muted)}
.feats li.done .dot{border:0;width:14px;height:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;transform:translateY(2px)}
.feats li.done .dot svg{width:10px;height:10px}
.feats li.done .what{color:var(--muted)}
.area.full{gap:6px;padding-block:12px}
.area.full .ahead p,.area.full .abar{display:none}
.area.full .ahead h2{font-size:15px;color:var(--muted)}
details.built summary{cursor:pointer;font:600 13px var(--f-ui);color:var(--accent);list-style:none;padding:4px 6px;border-radius:8px}
details.built summary::-webkit-details-marker{display:none}
details.built summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s}
details.built[open] summary::before{transform:rotate(90deg)}
details.built summary:hover{background:var(--ground)}

.side{display:grid;gap:14px}
.side h2{margin:4px 0 6px;font:800 19px/1.25 var(--f-ui);text-wrap:balance}
.side p{margin:0;color:var(--muted);font-size:14px}
.kicker{font:700 12px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.order{margin:10px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.order li::marker{font:500 12px var(--f-mono);color:var(--faint)}
.order li.now{color:var(--ink);font-weight:600}
.call{border-color:var(--onair);background:linear-gradient(var(--onair-soft),var(--panel) 70%)}
.call .kicker{color:var(--onair)}
.call .opts{display:grid;gap:6px;margin-top:10px}
.call .opts div{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.call .opts b{display:block;font-weight:700}
.feed{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px}
.feed li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:14px}
.feed li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translateY(-1px)}
.feed li.info::before{background:var(--cue)}
.feed b{font-weight:700}
.feed .arrow{color:var(--muted)}
.feed time{font:500 12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--faint);text-align:center}
</style>

<div class="wrap">
  <header class="mast">
    <span class="brand">stationwagon</span>
    <span class="sub">Project map · the final app</span>
    <span class="meta" id="meta"></span>
  </header>

  <section class="band" aria-label="Progress to the final app">
    <div class="total" id="total"></div>
    <div class="scale" id="scale" role="img"></div>
    <div class="legend"><span class="done">Built</span><span class="progress">Building now</span><span class="waiting">Waiting on you</span><span class="next">Next, in this version</span><span>Later</span></div>
    <div class="road" id="road"></div>
  </section>

  <div class="main">
    <div class="areas" id="areas"></div>
    <aside class="side">
      <section class="box">
        <span class="kicker">Next step</span>
        <h2 id="nextTitle"></h2>
        <p id="nextText"></p>
        <ol class="order" id="order"></ol>
      </section>
      <section class="box call" id="callBox">
        <span class="kicker">Needs your call</span>
        <h2 id="callTitle"></h2>
        <p id="callText"></p>
        <div class="opts" id="callOpts"></div>
      </section>
      <section class="box">
        <span class="kicker" id="feedTitle"></span>
        <ul class="feed" id="feed"></ul>
      </section>
    </aside>
  </div>

  <p class="note">Dates after 20 October are estimates. Source: <code>docs/project-map.html</code>, updated with <code>HANDOVER.md</code> after each round.</p>
</div>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const all = MAP.areas.flatMap((a) => a.features), built = all.filter((f) => f.state === "done").length;
const waiting = all.filter((f) => f.state === "waiting").length + (MAP.call ? 1 : 0);

$("meta").innerHTML = `<span>Updated <b>${esc(MAP.updated)}</b></span><span><b>${MAP.commits}</b> commits</span><span>Version <b>${esc(MAP.version)}</b></span>` +
  (waiting ? `<span class="waiting">${waiting} waiting on you</span>` : "");
$("total").innerHTML = `<span class="big">${built}</span><span class="of">of ${all.length}</span><span class="lbl">features of the final app built</span><span class="found">${esc(MAP.foundation)}</span>`;
const scale = $("scale");
scale.style.setProperty("--n", all.length);
scale.setAttribute("aria-label", `${built} of ${all.length} features built`);
scale.innerHTML = MAP.areas.flatMap((a) => a.features.map((f) => `<i class="${f.state}" title="${esc(a.name + ": " + f.text)}"></i>`)).join("");

const rank = { progress: 0, waiting: 1, next: 2, later: 3 };
const stops = MAP.road.map((r) => {
  const fs = all.filter((f) => f.v === r.v), d = fs.filter((f) => f.state === "done").length;
  const full = fs.length > 0 && d === fs.length;
  return { full, html: `<div class="stop ${r.state || ""}${full ? " full" : ""}"><span class="ver">${esc(r.v)}</span><span class="name">${esc(r.name)}</span><span class="when">${esc(r.when)}</span>` +
    `<span class="cnt">${d} of ${fs.length} built</span><span class="mini"><b style="width:${fs.length ? (100 * d / fs.length) : 0}%"></b></span>${full ? "" : `<ul class="steps">${fs.slice().sort((x, y) => (rank[x.state] ?? -1) - (rank[y.state] ?? -1)).map((f) => `<li class="${f.state}"><i></i>${esc(f.text)}</li>`).join("")}</ul>`}</div>` };
});
const doneStops = stops.filter((x) => x.full);
$("road").innerHTML = (doneStops.length ? `<div class="donestops">${doneStops.map((x) => x.html).join("")}</div>` : "") + stops.filter((x) => !x.full).map((x) => x.html).join("");

const row = (f) => `<li class="${f.state}"><span class="dot">${f.state === "done" ? CHECK : ""}</span><span class="what">${esc(f.text)}${f.note ? `<small>${esc(f.note)}</small>` : ""}</span><span class="tag">${f.state === "progress" ? "now · " : f.state === "waiting" ? "you · " : ""}${esc(f.v)}</span></li>`;
$("areas").innerHTML = MAP.areas.slice().sort((a, b) => (a.features.every((f) => f.state === "done") ? 1 : 0) - (b.features.every((f) => f.state === "done") ? 1 : 0)).map((a) => {
  const open = a.features.filter((f) => f.state !== "done").sort((x, y) => rank[x.state] - rank[y.state]), done = a.features.filter((f) => f.state === "done");
  const full = !open.length;
  return `<section class="box area${full ? " full" : ""}"><div class="ahead"><h2>${esc(a.name)}</h2><span class="cnt">${done.length} of ${a.features.length}</span><p>${esc(a.blurb)}</p></div>` +
    `<div class="abar">${a.features.map((f) => `<i class="${f.state}"></i>`).join("")}</div>` +
    (open.length ? `<ul class="feats">${open.map(row).join("")}</ul>` : "") +
    (done.length ? `<details class="built"><summary>Built (${done.length})</summary><ul class="feats">${done.map(row).join("")}</ul></details>` : "") +
    `</section>`;
}).join("");

$("nextTitle").textContent = MAP.next.title;
$("nextText").textContent = MAP.next.text;
$("order").innerHTML = (MAP.next.order || []).map((o, i) => `<li class="${i === 0 ? "now" : ""}">${esc(o)}</li>`).join("");
if (MAP.call) {
  $("callTitle").textContent = MAP.call.title;
  $("callText").textContent = MAP.call.text;
  $("callOpts").innerHTML = MAP.call.opts.map((o) => `<div><b>${esc(o.b)}</b>${esc(o.t)}</div>`).join("");
} else {
  $("callBox").hidden = true; // nothing waiting on the user
}
$("feedTitle").textContent = MAP.feedTitle;
$("feed").innerHTML = MAP.feed.map((f) =>
  `<li class="${f.kind || ""}"><span><b>${esc(f.what)}</b> <span class="arrow">→ ${esc(f.to)}</span></span><time>${esc(f.at)}</time></li>`).join("");
</script>
